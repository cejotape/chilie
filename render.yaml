# render.yaml — Blueprint para cejotape/chilie
#
# Dos servicios:
#   1) chilie-landing  → Static Site (sirve chilieia.com)
#   2) chilie-chatbot  → Web Service Node dentro de server/ (API del bot + form contacto)

services:

  # ────────────────────────── 1. LANDING ESTÁTICA ──────────────────────────
  - type: web
    runtime: static
    name: chilie-landing
    branch: main
    buildCommand: ""
    staticPublishPath: ./
    autoDeploy: true
    # ── URLs limpias (replican lo que hacía Express en server.js) ──
    # Cada rewrite mantiene la URL bonita en el navegador y sirve el HTML real.
    routes:
      - type: rewrite
        source: /servicios
        destination: /pages/servicios.html
      - type: rewrite
        source: /nosotros
        destination: /pages/nosotros.html
      - type: rewrite
        source: /contacto
        destination: /pages/contacto.html
      - type: rewrite
        source: /demos
        destination: /pages/demos.html
      - type: rewrite
        source: /aviso-legal
        destination: /pages/aviso-legal.html
      - type: rewrite
        source: /politica-privacidad
        destination: /pages/politica-privacidad.html
      - type: rewrite
        source: /politica-cookies
        destination: /pages/politica-cookies.html
      - type: rewrite
        source: /blog
        destination: /pages/blog.html
      - type: rewrite
        source: /blog/chatbot-whatsapp
        destination: /pages/blog/chatbot-whatsapp.html
      - type: rewrite
        source: /blog/precio-chatbot
        destination: /pages/blog/precio-chatbot.html
      # ── 301 desde las URLs .html antiguas a las limpias (SEO) ──
      - type: redirect
        source: /index.html
        destination: /
      - type: redirect
        source: /pages/servicios.html
        destination: /servicios
      - type: redirect
        source: /pages/nosotros.html
        destination: /nosotros
      - type: redirect
        source: /pages/contacto.html
        destination: /contacto
      - type: redirect
        source: /pages/demos.html
        destination: /demos
      - type: redirect
        source: /pages/aviso-legal.html
        destination: /aviso-legal
      - type: redirect
        source: /pages/politica-privacidad.html
        destination: /politica-privacidad
      - type: redirect
        source: /pages/politica-cookies.html
        destination: /politica-cookies
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains; preload"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # ────────────────────────── 2. CHATBOT NODE ──────────────────────────────
  - type: web
    runtime: node
    name: chilie-chatbot
    plan: starter
    region: frankfurt
    branch: main
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: ALLOWED_ORIGINS
        value: https://chilieia.com,https://www.chilieia.com,https://chilie-landing.onrender.com
      # ─── Secretos: se rellenan en el dashboard ───
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
