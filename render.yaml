      # ── blog:end
      # ── 301 desde las URLs .html antiguas a las limpias (SEO) ──
      - type: redirect
        source: /index.html
        destination: /
      - type: redirect
        source: /pages/servicios.html
        destination: /servicios
      - type: redirect
        source: /pages/nosotros.html
        destination: /nosotros
      - type: redirect
        source: /pages/contacto.html
        destination: /contacto
      - type: redirect
        source: /pages/demos.html
        destination: /demos
      - type: redirect
        source: /pages/aviso-legal.html
        destination: /aviso-legal
      - type: redirect
        source: /pages/politica-privacidad.html
        destination: /politica-privacidad
      - type: redirect
        source: /pages/politica-cookies.html
        destination: /politica-cookies
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains; preload"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # ────────────────────────── 2. CHATBOT NODE ──────────────────────────────
  - type: web
    runtime: node
    name: chilie-chatbot
    plan: starter
    region: frankfurt
    branch: main
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: ALLOWED_ORIGINS
        value: https://chilieia.com,https://www.chilieia.com,https://chilie-landing.onrender.com
      # ─── Secretos: se rellenan en el dashboard ───
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
